services:
  mongo:
    image: mongo:7
    container_name: ekc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: ekc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: ekc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo_data:
  qdrant_data:
